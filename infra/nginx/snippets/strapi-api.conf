# Read-only proxy to the Strapi Content API (ADR-0003 section 2, D4).
# Included ONLY from the exact-match allowlist locations of default.conf.

# GET (and therefore HEAD) only; any other method gets 403.
limit_except GET {
    deny all;
}

# Best-effort rejection of draft reads. $args is the raw query, so an encoded key
# (%73tatus) bypasses it: the real guarantee is the published-only middleware in Strapi.
if ($args ~* "(^|&)(status|publicationFilter)(=|%5B|\[)") {
    return 400;
}

# F-00.12: the location is chosen on the NORMALISED URI ($uri: %XX decoded, `..` and `//`
# resolved), so `/api/users/..%2Fplans` or `/content-manager/...%2F..%2Fapi%2Fplans` land here.
#  (b) Reject any request whose ORIGINAL path is not literally an allowlisted path.
if ($request_uri !~ "^/api/(countries|form-fields|plans|country-selection)(\?|$)") {
    return 404;
}

#  (a) Forward only the normalised path that matched the exact location, never the original
#      URI. `strapi` is an upstream block, so a variable in proxy_pass needs no resolver.
proxy_pass http://strapi$uri$is_args$args;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Never forward credentials, even if the browser sent them.
proxy_set_header Authorization "";
proxy_set_header Cookie "";

# GET has no body: never forward one.
proxy_pass_request_body off;
proxy_set_header Content-Length "";

proxy_connect_timeout 5s;
proxy_read_timeout 15s;

# No HTTP cache anywhere: every reload asks Strapi (Q-01.20, REQ-01.6, REQ-02.23).
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Set-Cookie;
proxy_hide_header X-Powered-By;
# Strapi's own security headers (strapi::security) that nginx sets itself: hide them to avoid duplicates.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Content-Type-Options;
add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/security-headers.conf;
